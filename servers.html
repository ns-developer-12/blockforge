<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover"
    >

    <meta name="theme-color" content="#060608">
    <meta name="color-scheme" content="dark">

    <title>سرورهای بدراک | BlockForge</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

    <style>
        :root {
            --bg: #060608;
            --bg-soft: #0b0b0f;
            --card: rgba(17, 17, 23, .72);
            --card-hover: rgba(23, 23, 31, .9);

            --border: rgba(255,255,255,.065);
            --border-hover: rgba(0,188,212,.3);

            --text: #f1f1f1;
            --text-soft: #a6a6ac;
            --text-muted: #66666d;

            --cyan: #00c8df;
            --cyan-soft: rgba(0,200,223,.1);

            --green: #2ecc71;
            --red: #e74c3c;
            --gold: #ffd166;
            --orange: #ff9f43;

            --radius: 17px;
            --radius-lg: 24px;

            --shadow:
                0 10px 35px rgba(0,0,0,.28);

            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
            font-size: 15px;
        }

        body {
            min-height: 100vh;
            font-family: "Vazirmatn", sans-serif;
            background:
                radial-gradient(
                    circle at 10% 0%,
                    rgba(0,188,212,.075),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 90% 70%,
                    rgba(0,188,212,.035),
                    transparent 35%
                ),
                var(--bg);

            color: var(--text);
            line-height: 1.7;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;

            padding-bottom: calc(30px + var(--safe-bottom));
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            border: 0;
        }

        /* =====================================================
           HEADER
        ===================================================== */

        .header {
            position: sticky;
            top: 0;
            z-index: 100;

            display: flex;
            align-items: center;
            gap: 10px;

            min-height: 54px;
            padding: 8px 14px;

            background: rgba(7,7,10,.84);
            backdrop-filter: blur(24px) saturate(150%);
            -webkit-backdrop-filter: blur(24px) saturate(150%);

            border-bottom: 1px solid var(--border);
        }

        .back-btn,
        .header-btn {
            width: 36px;
            height: 36px;

            flex: 0 0 36px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            color: #aaa;
            background: rgba(255,255,255,.045);
            border: 1px solid var(--border);

            cursor: pointer;
            text-decoration: none;

            transition:
                transform .2s ease,
                background .2s ease,
                color .2s ease,
                border-color .2s ease;
        }

        .back-btn:hover,
        .header-btn:hover {
            color: #fff;
            background: rgba(0,200,223,.1);
            border-color: rgba(0,200,223,.25);
        }

        .back-btn:active,
        .header-btn:active {
            transform: scale(.92);
        }

        .header-center {
            flex: 1;
            min-width: 0;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .header-icon {
            color: var(--cyan);
            font-size: .9rem;
        }

        .header-title {
            color: #fff;
            font-size: .92rem;
            font-weight: 800;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* =====================================================
           HERO
        ===================================================== */

        .hero {
            position: relative;
            overflow: hidden;

            margin: 15px;
            padding: 24px 18px;

            text-align: center;

            border-radius: var(--radius-lg);
            border: 1px solid rgba(0,200,223,.16);

            background:
                radial-gradient(
                    circle at 50% -30%,
                    rgba(0,200,223,.17),
                    transparent 60%
                ),
                linear-gradient(
                    145deg,
                    rgba(0,200,223,.075),
                    rgba(20,20,28,.58)
                );

            box-shadow: var(--shadow);
        }

        .hero::after {
            content: "";

            position: absolute;
            width: 150px;
            height: 150px;

            left: -60px;
            bottom: -100px;

            border-radius: 50%;

            background: rgba(0,200,223,.07);
            filter: blur(25px);
        }

        .hero-icon {
            position: relative;
            z-index: 1;

            width: 54px;
            height: 54px;

            margin: 0 auto 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 17px;

            color: var(--cyan);
            font-size: 1.45rem;

            background: rgba(0,200,223,.09);
            border: 1px solid rgba(0,200,223,.18);

            box-shadow:
                0 0 30px rgba(0,200,223,.09);
        }

        .hero-title {
            position: relative;
            z-index: 1;

            color: #fff;
            font-size: 1.05rem;
            font-weight: 900;

            margin-bottom: 5px;
        }

        .hero-subtitle {
            position: relative;
            z-index: 1;

            max-width: 420px;
            margin: auto;

            color: var(--text-soft);
            font-size: .67rem;
            line-height: 1.9;
        }

        /* =====================================================
           SEARCH
        ===================================================== */

        .tools {
            margin: 0 15px 17px;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 9px;

            min-height: 47px;
            padding: 0 13px;

            border-radius: 15px;

            background: rgba(17,17,23,.75);
            border: 1px solid var(--border);

            transition:
                border-color .2s ease,
                box-shadow .2s ease;
        }

        .search-box:focus-within {
            border-color: rgba(0,200,223,.35);

            box-shadow:
                0 0 0 3px rgba(0,200,223,.055);
        }

        .search-box > i {
            color: var(--text-muted);
            font-size: .8rem;
        }

        .search-box input {
            flex: 1;

            min-width: 0;

            color: #fff;
            background: transparent;
            border: 0;
            outline: 0;

            font-size: .74rem;
        }

        .search-box input::placeholder {
            color: #55555c;
        }

        .clear-search {
            width: 27px;
            height: 27px;

            display: none;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            color: #888;
            background: rgba(255,255,255,.05);

            cursor: pointer;
        }

        .clear-search.visible {
            display: flex;
        }

        .filter-row {
            display: flex;
            align-items: center;
            gap: 7px;

            margin-top: 9px;

            overflow-x: auto;
            scrollbar-width: none;
        }

        .filter-row::-webkit-scrollbar {
            display: none;
        }

        .filter-chip {
            flex: 0 0 auto;

            display: inline-flex;
            align-items: center;
            gap: 5px;

            padding: 7px 12px;

            color: #85858c;
            background: rgba(255,255,255,.035);

            border: 1px solid var(--border);
            border-radius: 20px;

            font-size: .62rem;
            font-weight: 600;

            cursor: pointer;

            transition: .2s ease;
        }

        .filter-chip.active {
            color: #001014;
            background: var(--cyan);
            border-color: var(--cyan);

            box-shadow:
                0 4px 18px rgba(0,200,223,.16);
        }

        .filter-chip:active {
            transform: scale(.96);
        }

        /* =====================================================
           STATS
        ===================================================== */

        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;

            margin: 0 15px 20px;
        }

        .stat-card {
            min-width: 0;

            padding: 11px 8px;

            text-align: center;

            background: rgba(17,17,23,.58);
            border: 1px solid var(--border);
            border-radius: 13px;
        }

        .stat-icon {
            color: var(--cyan);
            font-size: .72rem;
            margin-bottom: 2px;
        }

        .stat-value {
            color: #fff;
            font-size: .82rem;
            font-weight: 800;
        }

        .stat-label {
            color: #606067;
            font-size: .52rem;
        }

        /* =====================================================
           SECTION TITLE
        ===================================================== */

        .section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 10px;

            margin: 0 15px 11px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 7px;

            color: #fff;
            font-size: .86rem;
            font-weight: 800;
        }

        .section-title i {
            color: var(--cyan);
        }

        .section-count {
            color: #66666d;
            font-size: .58rem;
        }

        /* =====================================================
           TOP SERVERS
        ===================================================== */

        .top-section {
            margin-bottom: 21px;
        }

        .top-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0,1fr));
            gap: 8px;

            padding: 0 15px;
        }

        .top-card {
            position: relative;

            min-width: 0;

            padding: 13px 8px;

            text-align: center;

            border-radius: 16px;

            background: rgba(17,17,23,.7);
            border: 1px solid var(--border);

            box-shadow: 0 7px 25px rgba(0,0,0,.22);

            transition:
                transform .25s ease,
                border-color .25s ease;
        }

        .top-card:hover {
            transform: translateY(-3px);
            border-color: rgba(0,200,223,.2);
        }

        .top-card.gold {
            background:
                linear-gradient(
                    180deg,
                    rgba(255,209,102,.075),
                    rgba(17,17,23,.7)
                );

            border-color: rgba(255,209,102,.22);
        }

        .top-rank {
            position: absolute;
            top: 7px;
            right: 7px;

            width: 23px;
            height: 23px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            font-size: .57rem;
            font-weight: 900;

            background: rgba(255,255,255,.06);
            color: #aaa;
        }

        .top-rank.first {
            color: #171000;
            background: var(--gold);
        }

        .top-rank.second {
            color: #111;
            background: #c7c7c7;
        }

        .top-rank.third {
            color: #fff;
            background: #b56b32;
        }

        .vip-badge {
            position: absolute;
            left: 7px;
            top: 7px;

            padding: 2px 5px;

            border-radius: 5px;

            color: #161000;
            background: linear-gradient(135deg,#ffd166,#ff9f43);

            font-size: .4rem;
            font-weight: 900;
        }

        .top-icon {
            width: 46px;
            height: 46px;

            margin: 6px auto 8px;

            border-radius: 12px;

            background-size: cover;
            background-position: center;

            border: 1px solid rgba(255,255,255,.1);

            box-shadow:
                0 5px 15px rgba(0,0,0,.25);
        }

        .top-name {
            color: #fff;

            font-size: .65rem;
            font-weight: 800;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;

            margin-bottom: 8px;
        }

        .top-address {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;

            min-width: 0;
        }

        .address-part {
            min-width: 0;
            max-width: 100%;

            padding: 4px 6px;

            color: var(--cyan);
            background: rgba(0,200,223,.055);
            border: 1px solid rgba(0,200,223,.1);
            border-radius: 6px;

            font-family: monospace;
            font-size: .48rem;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;

            cursor: pointer;
        }

        .address-separator {
            color: #555;
            font-size: .5rem;
        }

        /* =====================================================
           SERVER LIST
        ===================================================== */

        .server-list {
            display: flex;
            flex-direction: column;
            gap: 8px;

            padding: 0 15px;
        }

        .server-card {
            position: relative;

            display: flex;
            align-items: center;
            gap: 11px;

            padding: 11px;

            border-radius: 16px;

            background: rgba(17,17,23,.67);
            border: 1px solid var(--border);

            box-shadow: 0 6px 22px rgba(0,0,0,.18);

            animation: cardIn .35s ease both;

            transition:
                transform .2s ease,
                border-color .2s ease,
                background .2s ease;
        }

        .server-card:hover {
            transform: translateY(-2px);

            background: var(--card-hover);
            border-color: var(--border-hover);
        }

        .server-status {
            position: relative;

            width: 8px;
            height: 8px;

            flex: 0 0 8px;

            border-radius: 50%;
        }

        .server-status.online {
            background: var(--green);
            box-shadow: 0 0 10px rgba(46,204,113,.55);
        }

        .server-status.offline {
            background: var(--red);
            box-shadow: 0 0 8px rgba(231,76,60,.35);
        }

        .server-icon {
            width: 48px;
            height: 48px;

            flex: 0 0 48px;

            border-radius: 12px;

            background-size: cover;
            background-position: center;

            border: 1px solid rgba(255,255,255,.08);
        }

        .server-info {
            flex: 1;
            min-width: 0;
        }

        .server-name-row {
            display: flex;
            align-items: center;
            gap: 5px;

            min-width: 0;

            margin-bottom: 5px;
        }

        .server-name {
            min-width: 0;

            color: #fff;

            font-size: .72rem;
            font-weight: 750;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .vip-mini {
            flex: 0 0 auto;

            padding: 1px 5px;

            border-radius: 5px;

            color: #171000;
            background: var(--gold);

            font-size: .4rem;
            font-weight: 900;
        }

        .server-meta {
            display: flex;
            align-items: center;
            gap: 5px;

            min-width: 0;
        }

        .server-address {
            max-width: 65%;

            display: inline-flex;
            align-items: center;
            gap: 4px;

            padding: 3px 7px;

            color: var(--cyan);
            background: rgba(0,200,223,.045);
            border: 1px solid rgba(0,200,223,.09);
            border-radius: 6px;

            font-family: monospace;
            font-size: .52rem;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;

            cursor: pointer;
        }

        .server-port {
            flex: 0 0 auto;

            padding: 3px 7px;

            color: #888;
            background: rgba(255,255,255,.035);
            border: 1px solid var(--border);
            border-radius: 6px;

            font-family: monospace;
            font-size: .5rem;

            cursor: pointer;
        }

        .copy-btn {
            width: 32px;
            height: 32px;

            flex: 0 0 32px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 10px;

            color: #777;
            background: rgba(255,255,255,.035);
            border: 1px solid var(--border);

            cursor: pointer;

            transition: .2s ease;
        }

        .copy-btn:hover {
            color: var(--cyan);
            background: rgba(0,200,223,.08);
            border-color: rgba(0,200,223,.2);
        }

        .copy-btn:active {
            transform: scale(.9);
        }

        /* =====================================================
           EMPTY STATE
        ===================================================== */

        .empty {
            padding: 55px 20px;

            text-align: center;
        }

        .empty-icon {
            width: 70px;
            height: 70px;

            margin: 0 auto 13px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 22px;

            color: #34343a;
            background: rgba(255,255,255,.025);
            border: 1px solid var(--border);

            font-size: 1.7rem;
        }

        .empty-title {
            color: #aaa;
            font-size: .82rem;
            font-weight: 700;

            margin-bottom: 4px;
        }

        .empty-text {
            color: #55555c;
            font-size: .62rem;
        }

        .reset-btn {
            margin-top: 13px;

            padding: 7px 13px;

            color: var(--cyan);
            background: rgba(0,200,223,.07);
            border: 1px solid rgba(0,200,223,.15);

            border-radius: 10px;

            font-size: .6rem;
            cursor: pointer;
        }

        /* =====================================================
           LOADING
        ===================================================== */

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 55px 20px;

            color: #555;
        }

        .loader {
            width: 32px;
            height: 32px;

            border-radius: 50%;

            border: 3px solid rgba(255,255,255,.06);
            border-top-color: var(--cyan);

            animation: spin .8s linear infinite;

            margin-bottom: 10px;
        }

        .loading span {
            font-size: .62rem;
        }

        /* =====================================================
           TOAST
        ===================================================== */

        .toast {
            position: fixed;

            left: 50%;
            bottom: calc(22px + var(--safe-bottom));

            z-index: 999;

            display: flex;
            align-items: center;
            gap: 8px;

            max-width: calc(100vw - 30px);

            padding: 10px 15px;

            border-radius: 13px;

            color: #fff;
            background: rgba(24,24,31,.94);

            border: 1px solid rgba(255,255,255,.08);

            box-shadow:
                0 15px 40px rgba(0,0,0,.65);

            backdrop-filter: blur(20px);

            font-size: .64rem;
            font-weight: 600;

            pointer-events: none;

            opacity: 0;
            transform: translate(-50%, 20px);

            transition:
                opacity .25s ease,
                transform .25s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .toast.success i {
            color: var(--green);
        }

        .toast.error i {
            color: var(--red);
        }

        /* =====================================================
           ANIMATIONS
        ===================================================== */

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (min-width: 600px) {
            .server-list {
                display: grid;
                grid-template-columns: repeat(2, minmax(0,1fr));
            }

            .server-card {
                min-width: 0;
            }
        }

        @media (min-width: 900px) {
            body {
                max-width: 1000px;
                margin: auto;
            }

            .header {
                border-radius: 0 0 16px 16px;
            }

            .server-list {
                grid-template-columns: repeat(3, minmax(0,1fr));
            }

            .top-grid {
                max-width: 700px;
                margin: auto;
            }
        }

        @media (max-width: 360px) {
            .top-grid {
                gap: 5px;
            }

            .top-card {
                padding: 11px 5px;
            }

            .server-address {
                max-width: 55%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- =====================================================
         HEADER
    ===================================================== -->

    <header class="header">

        <a href="index.html" class="back-btn" aria-label="بازگشت">
            <i class="fa-solid fa-arrow-right"></i>
        </a>

        <div class="header-center">
            <i class="fa-solid fa-server header-icon"></i>
            <div class="header-title">سرورهای بدراک</div>
        </div>

        <button
            class="header-btn"
            id="homeBtn"
            aria-label="خانه"
            title="خانه"
        >
            <i class="fa-solid fa-house"></i>
        </button>

    </header>


    <!-- =====================================================
         HERO
    ===================================================== -->

    <section class="hero">

        <div class="hero-icon">
            <i class="fa-solid fa-globe"></i>
        </div>

        <h1 class="hero-title">
            سرورهای Minecraft Bedrock
        </h1>

        <p class="hero-subtitle">
            بهترین سرورهای بدراک را پیدا کن و با یک لمس
            IP یا Port را کپی کن.
        </p>

    </section>


    <!-- =====================================================
         SEARCH & FILTER
    ===================================================== -->

    <section class="tools">

        <div class="search-box">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="search"
                id="searchInput"
                placeholder="جستجوی نام یا IP سرور..."
                autocomplete="off"
                spellcheck="false"
            >

            <button
                class="clear-search"
                id="clearSearch"
                type="button"
                aria-label="پاک کردن جستجو"
            >
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>


        <div class="filter-row" id="filterRow">

            <button
                type="button"
                class="filter-chip active"
                data-filter="all"
            >
                <i class="fa-solid fa-layer-group"></i>
                همه
            </button>

            <button
                type="button"
                class="filter-chip"
                data-filter="online"
            >
                <i class="fa-solid fa-circle"></i>
                آنلاین
            </button>

            <button
                type="button"
                class="filter-chip"
                data-filter="vip"
            >
                <i class="fa-solid fa-crown"></i>
                VIP
            </button>

            <button
                type="button"
                class="filter-chip"
                data-filter="name"
            >
                <i class="fa-solid fa-arrow-down-a-z"></i>
                الفبایی
            </button>

        </div>

    </section>


    <!-- =====================================================
         STATS
    ===================================================== -->

    <section class="stats-row">

        <div class="stat-card">
            <div class="stat-icon">
                <i class="fa-solid fa-server"></i>
            </div>

            <div
                class="stat-value"
                id="totalCount"
            >
                ۰
            </div>

            <div class="stat-label">
                کل سرورها
            </div>
        </div>


        <div class="stat-card">
            <div class="stat-icon">
                <i class="fa-solid fa-circle-check"></i>
            </div>

            <div
                class="stat-value"
                id="onlineCount"
            >
                ۰
            </div>

            <div class="stat-label">
                آنلاین
            </div>
        </div>


        <div class="stat-card">
            <div class="stat-icon">
                <i class="fa-solid fa-crown"></i>
            </div>

            <div
                class="stat-value"
                id="vipCount"
            >
                ۰
            </div>

            <div class="stat-label">
                VIP
            </div>
        </div>

    </section>


    <!-- =====================================================
         TOP SERVERS
    ===================================================== -->

    <section
        class="top-section"
        id="topSection"
    >

        <div class="section-head">

            <div class="section-title">
                <i class="fa-solid fa-trophy"></i>
                برترین سرورها
            </div>

            <div class="section-count">
                انتخاب ویژه
            </div>

        </div>

        <div
            class="top-grid"
            id="topGrid"
        ></div>

    </section>


    <!-- =====================================================
         ALL SERVERS
    ===================================================== -->

    <section>

        <div class="section-head">

            <div class="section-title">
                <i class="fa-solid fa-list"></i>
                سرورها
            </div>

            <div
                class="section-count"
                id="resultLabel"
            >
                ۰ نتیجه
            </div>

        </div>


        <div
            class="server-list"
            id="serverList"
        >

            <div class="loading">

                <div class="loader"></div>

                <span>
                    در حال بارگذاری سرورها...
                </span>

            </div>

        </div>

    </section>


    <!-- =====================================================
         TOAST
    ===================================================== -->

    <div
        class="toast"
        id="toast"
        role="status"
        aria-live="polite"
    ></div>


    <!-- =====================================================
         DATA
    ===================================================== -->

    <script src="servers.js"></script>

    <script>
        "use strict";

        /* =====================================================
           STATE
        ===================================================== */

        const state = {
            servers: [],
            query: "",
            filter: "all"
        };


        /* =====================================================
           ELEMENTS
        ===================================================== */

        const els = {
            search: document.getElementById("searchInput"),
            clear: document.getElementById("clearSearch"),

            filterRow: document.getElementById("filterRow"),

            topSection: document.getElementById("topSection"),
            topGrid: document.getElementById("topGrid"),

            serverList: document.getElementById("serverList"),

            totalCount: document.getElementById("totalCount"),
            onlineCount: document.getElementById("onlineCount"),
            vipCount: document.getElementById("vipCount"),

            resultLabel: document.getElementById("resultLabel"),

            toast: document.getElementById("toast"),

            homeBtn: document.getElementById("homeBtn")
        };


        /* =====================================================
           HELPERS
        ===================================================== */

        function escapeHTML(value) {

            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        function normalize(value) {

            return String(value ?? "")
                .trim()
                .toLowerCase()
                .replace(/\s+/g, " ");
        }


        function getServerName(server) {

            return server?.name
                ? String(server.name)
                : "سرور بدون نام";
        }


        function getServerIP(server) {

            return server?.ip
                ? String(server.ip)
                : "";
        }


        function getServerPort(server) {

            return server?.port
                ? String(server.port)
                : "19132";
        }


        function isOnline(server) {

            return server?.online === true ||
                   server?.online === 1 ||
                   server?.online === "true";
        }


        function isVIP(server) {

            return server?.vip === true ||
                   server?.vip === 1 ||
                   server?.vip === "true";
        }


        function getIcon(server, index) {

            if (server?.icon) {
                return String(server.icon);
            }

            return "https://picsum.photos/seed/blockforge-server-" +
                encodeURIComponent(index) +
                "/100/100";
        }


        /* =====================================================
           TOAST
        ===================================================== */

        let toastTimer = null;

        function showToast(message, type = "success") {

            clearTimeout(toastTimer);

            els.toast.className = "toast " + type;

            els.toast.innerHTML = `
                <i class="fa-solid ${
                    type === "error"
                        ? "fa-circle-exclamation"
                        : "fa-circle-check"
                }"></i>

                <span>${escapeHTML(message)}</span>
            `;

            requestAnimationFrame(() => {
                els.toast.classList.add("show");
            });

            toastTimer = setTimeout(() => {
                els.toast.classList.remove("show");
            }, 2200);
        }


        /* =====================================================
           COPY
        ===================================================== */

        async function copyText(text) {

            if (!text) {
                showToast("آدرس سرور موجود نیست", "error");
                return;
            }

            try {

                if (
                    navigator.clipboard &&
                    window.isSecureContext
                ) {
                    await navigator.clipboard.writeText(text);
                } else {

                    const textarea =
                        document.createElement("textarea");

                    textarea.value = text;

                    textarea.style.position = "fixed";
                    textarea.style.opacity = "0";
                    textarea.style.pointerEvents = "none";

                    document.body.appendChild(textarea);

                    textarea.focus();
                    textarea.select();

                    const success =
                        document.execCommand("copy");

                    textarea.remove();

                    if (!success) {
                        throw new Error("copy failed");
                    }
                }

                showToast("کپی شد: " + text);

            } catch (error) {

                showToast(
                    "کپی انجام نشد؛ دوباره امتحان کن",
                    "error"
                );
            }
        }


        function copyServerIP(server) {

            const ip = getServerIP(server);
            const port = getServerPort(server);

            if (!ip) {
                showToast("IP این سرور ثبت نشده است", "error");
                return;
            }

            copyText(ip + ":" + port);
        }


        /* =====================================================
           NORMALIZE DATA
        ===================================================== */

        function loadServers() {

            if (
                typeof BEDROCK_SERVERS === "undefined" ||
                !Array.isArray(BEDROCK_SERVERS)
            ) {
                state.servers = [];
                return;
            }

            state.servers = BEDROCK_SERVERS
                .filter(Boolean)
                .map((server, index) => ({
                    ...server,

                    _index: index,

                    name: getServerName(server),
                    ip: getServerIP(server),
                    port: getServerPort(server),

                    online: isOnline(server),
                    vip: isVIP(server),

                    icon: getIcon(server, index)
                }));
        }


        /* =====================================================
           STATS
        ===================================================== */

        function updateStats() {

            const total = state.servers.length;

            const online =
                state.servers.filter(isOnline).length;

            const vip =
                state.servers.filter(isVIP).length;

            els.totalCount.textContent =
                total.toLocaleString("fa-IR");

            els.onlineCount.textContent =
                online.toLocaleString("fa-IR");

            els.vipCount.textContent =
                vip.toLocaleString("fa-IR");
        }


        /* =====================================================
           FILTER
        ===================================================== */

        function getFilteredServers() {

            let result = [...state.servers];

            const query = normalize(state.query);

            if (query) {

                result = result.filter(server => {

                    const name =
                        normalize(server.name);

                    const ip =
                        normalize(server.ip);

                    const port =
                        normalize(server.port);

                    return (
                        name.includes(query) ||
                        ip.includes(query) ||
                        port.includes(query)
                    );
                });
            }


            switch (state.filter) {

                case "online":

                    result = result.filter(
                        server => server.online
                    );

                    break;


                case "vip":

                    result = result.filter(
                        server => server.vip
                    );

                    break;


                case "name":

                    result.sort((a, b) =>
                        a.name.localeCompare(
                            b.name,
                            "fa"
                        )
                    );

                    break;
            }

            return result;
        }


        /* =====================================================
           TOP SERVERS
        ===================================================== */

        function renderTopServers() {

            const top = state.servers.slice(0, 3);

            if (!top.length) {

                els.topSection.style.display = "none";
                return;
            }

            els.topSection.style.display = "block";

            els.topGrid.innerHTML =
                top.map((server, index) =>
                    createTopCard(server, index)
                ).join("");
        }


        function createTopCard(server, index) {

            const rankClasses = [
                "first",
                "second",
                "third"
            ];

            const medals = [
                "🥇",
                "🥈",
                "🥉"
            ];

            const ip =
                escapeHTML(server.ip);

            const port =
                escapeHTML(server.port);

            return `
                <article class="top-card">

                    ${
                        index < 3
                            ? `
                                <div
                                    class="top-rank ${rankClasses[index]}"
                                >
                                    ${medals[index]}
                                </div>
                            `
                            : ""
                    }

                    ${
                        server.vip
                            ? `
                                <span class="vip-badge">
                                    VIP
                                </span>
                            `
                            : ""
                    }

                    <div
                        class="top-icon"
                        style="
                            background-image:
                            url('${escapeHTML(server.icon)}');
                        "
                    ></div>

                    <div
                        class="top-name"
                        title="${escapeHTML(server.name)}"
                    >
                        ${escapeHTML(server.name)}
                    </div>

                    <div class="top-address">

                        <button
                            type="button"
                            class="address-part"
                            data-copy="${ip}"
                            title="کپی IP"
                        >
                            ${ip || "بدون IP"}
                        </button>

                        <span class="address-separator">
                            :
                        </span>

                        <button
                            type="button"
                            class="address-part"
                            data-copy="${port}"
                            title="کپی Port"
                        >
                            ${port}
                        </button>

                    </div>

                </article>
            `;
        }


        /* =====================================================
           SERVER CARD
        ===================================================== */

        function createServerCard(server, index) {

            return `
                <article
                    class="server-card"
                    style="animation-delay:${Math.min(index * .025, .3)}s"
                >

                    <span
                        class="server-status ${
                            server.online
                                ? "online"
                                : "offline"
                        }"
                        title="${
                            server.online
                                ? "آنلاین"
                                : "آفلاین"
                        }"
                    ></span>


                    <div
                        class="server-icon"
                        style="
                            background-image:
                            url('${escapeHTML(server.icon)}');
                        "
                    ></div>


                    <div class="server-info">

                        <div class="server-name-row">

                            <div
                                class="server-name"
                                title="${escapeHTML(server.name)}"
                            >
                                ${escapeHTML(server.name)}
                            </div>

                            ${
                                server.vip
                                    ? `
                                        <span class="vip-mini">
                                            VIP
                                        </span>
                                    `
                                    : ""
                            }

                        </div>


                        <div class="server-meta">

                            <button
                                type="button"
                                class="server-address"
                                data-copy="${escapeHTML(server.ip)}"
                                title="کپی IP"
                            >
                                <i class="fa-solid fa-globe"></i>
                                ${escapeHTML(server.ip) || "بدون IP"}
                            </button>


                            <button
                                type="button"
                                class="server-port"
                                data-copy="${escapeHTML(server.port)}"
                                title="کپی Port"
                            >
                                :${escapeHTML(server.port)}
                            </button>

                        </div>

                    </div>


                    <button
                        type="button"
                        class="copy-btn"
                        data-copy-full="${escapeHTML(
                            server.ip + ":" + server.port
                        )}"
                        title="کپی IP و Port"
                        aria-label="کپی IP و Port"
                    >
                        <i class="fa-regular fa-copy"></i>
                    </button>

                </article>
            `;
        }


        /* =====================================================
           EMPTY
        ===================================================== */

        function renderEmpty(hasSearch = false) {

            els.serverList.innerHTML = `
                <div class="empty">

                    <div class="empty-icon">
                        <i class="fa-solid ${
                            hasSearch
                                ? "fa-magnifying-glass"
                                : "fa-server"
                        }"></i>
                    </div>

                    <div class="empty-title">
                        ${
                            hasSearch
                                ? "سروری پیدا نشد"
                                : "هنوز سروری ثبت نشده"
                        }
                    </div>

                    <div class="empty-text">
                        ${
                            hasSearch
                                ? "عبارت جستجو یا فیلتر را تغییر بده."
                                : "اطلاعات سرورها در servers.js قرار می‌گیرد."
                        }
                    </div>

                    ${
                        hasSearch
                            ? `
                                <button
                                    type="button"
                                    class="reset-btn"
                                    id="resetSearch"
                                >
                                    <i class="fa-solid fa-rotate-left"></i>
                                    پاک کردن جستجو
                                </button>
                            `
                            : ""
                    }

                </div>
            `;

            const reset =
                document.getElementById("resetSearch");

            if (reset) {

                reset.addEventListener(
                    "click",
                    clearAllFilters
                );
            }
        }


        /* =====================================================
           RENDER
        ===================================================== */

        function renderServers() {

            const result =
                getFilteredServers();

            els.resultLabel.textContent =
                `${result.length.toLocaleString("fa-IR")} نتیجه`;


            if (!result.length) {

                renderEmpty(
                    Boolean(state.query) ||
                    state.filter !== "all"
                );

                return;
            }


            els.serverList.innerHTML =
                result
                    .map((server, index) =>
                        createServerCard(
                            server,
                            index
                        )
                    )
                    .join("");
        }


        /* =====================================================
           FILTER UI
        ===================================================== */

        function updateFilterUI() {

            els.filterRow
                .querySelectorAll(".filter-chip")
                .forEach(button => {

                    button.classList.toggle(
                        "active",
                        button.dataset.filter === state.filter
                    );
                });
        }


        /* =====================================================
           CLEAR
        ===================================================== */

        function updateClearButton() {

            els.clear.classList.toggle(
                "visible",
                Boolean(state.query)
            );
        }


        function clearAllFilters() {

            state.query = "";
            state.filter = "all";

            els.search.value = "";

            updateClearButton();
            updateFilterUI();

            renderServers();
        }


        /* =====================================================
           EVENTS
        ===================================================== */

        els.search.addEventListener(
            "input",
            () => {

                state.query =
                    els.search.value.trim();

                updateClearButton();
                renderServers();
            }
        );


        els.clear.addEventListener(
            "click",
            () => {

                els.search.value = "";
                state.query = "";

                updateClearButton();
                renderServers();

                els.search.focus();
            }
        );


        els.filterRow.addEventListener(
            "click",
            event => {

                const button =
                    event.target.closest(
                        ".filter-chip"
                    );

                if (!button) return;

                state.filter =
                    button.dataset.filter || "all";

                updateFilterUI();
                renderServers();
            }
        );


        /*
         * Event delegation
         * به جای onclick برای تک‌تک کارت‌ها
         */

        document.addEventListener(
            "click",
            event => {

                const copyButton =
                    event.target.closest(
                        "[data-copy]"
                    );

                if (copyButton) {

                    copyText(
                        copyButton.dataset.copy
                    );

                    return;
                }


                const fullCopy =
                    event.target.closest(
                        "[data-copy-full]"
                    );

                if (fullCopy) {

                    copyText(
                        fullCopy.dataset.copyFull
                    );
                }
            }
        );


        els.homeBtn.addEventListener(
            "click",
            () => {
                window.location.href =
                    "index.html";
            }
        );


        /* =====================================================
           KEYBOARD
        ===================================================== */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "/" &&
                    document.activeElement !== els.search
                ) {

                    event.preventDefault();

                    els.search.focus();
                }


                if (
                    event.key === "Escape" &&
                    document.activeElement === els.search
                ) {

                    if (state.query) {
                        clearAllFilters();
                    } else {
                        els.search.blur();
                    }
                }
            }
        );


        /* =====================================================
           INIT
        ===================================================== */

        function init() {

            loadServers();

            updateStats();

            renderTopServers();

            updateFilterUI();

            updateClearButton();

            renderServers();
        }


        init();

    </script>

</body>
</html>
