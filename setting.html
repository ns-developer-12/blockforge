<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تنظیمات | BlockForge</title><link rel="stylesheet" href="theme.css"></head><body><main class="simple-page"><a class="back" href="index.html">← بازگشت به خانه</a><div class="brand">BLOCK<span>FORGE</span></div><h1>تنظیمات</h1><p style="color:var(--bf-muted)">ظاهر و زبان برنامه را مدیریت کنید.</p><section class="settings-card"><div class="setting-row"><div><div class="setting-label">حالت نمایش</div><div class="setting-hint" id="themeLabel">دارک مود</div></div><label class="switch" aria-label="تغییر حالت تاریک و روشن"><input id="themeToggle" type="checkbox"><span class="slider round"><span class="sun-moon"><svg class="moon-dot" style="position:absolute;left:10px;top:3px;width:6px;height:6px" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50"/></svg><svg class="moon-dot" style="position:absolute;left:2px;top:10px;width:10px;height:10px" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50"/></svg><svg class="moon-dot" style="position:absolute;left:16px;top:18px;width:3px;height:3px" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50"/></svg></span><span class="stars"><svg class="star" id="star-1" viewBox="0 0 20 20"><path d="M10 0 12 8 20 10 12 12 10 20 8 12 0 10 8 8Z"/></svg><svg class="star" id="star-2" viewBox="0 0 20 20"><path d="M10 0 12 8 20 10 12 12 10 20 8 12 0 10 8 8Z"/></svg><svg class="star" id="star-3" viewBox="0 0 20 20"><path d="M10 0 12 8 20 10 12 12 10 20 8 12 0 10 8 8Z"/></svg><svg class="star" id="star-4" viewBox="0 0 20 20"><path d="M10 0 12 8 20 10 12 12 10 20 8 12 0 10 8 8Z"/></svg></span></span></label></div><div class="setting-row"><div><div class="setting-label">زبان برنامه</div><div class="setting-hint">زبان رابط کاربری</div></div><select class="setting-select" id="language"><option value="fa">فارسی</option><option value="en">English</option></select></div></section><p class="setting-hint">تنظیمات روی همین مرورگر ذخیره می‌شوند.</p></main><script src="theme.js"></script><script>const toggle=document.getElementById('themeToggle'),label=document.getElementById('themeLabel'),lang=document.getElementById('language');function sync(){let d=document.documentElement.dataset.theme!=='light';toggle.checked=d;label.textContent=d?'دارک مود':'لایت مود'}sync();toggle.addEventListener('change',()=>{BlockForgeSettings.setTheme(toggle.checked?'dark':'light');sync()});lang.value=localStorage.getItem('bf_lang')||'fa';lang.addEventListener('change',()=>{BlockForgeSettings.setLanguage(lang.value);if(lang.value==='en'){document.documentElement.dir='ltr';document.querySelector('h1').textContent='Settings';document.querySelector('.setting-label').textContent='Appearance';document.querySelector('.setting-hint').textContent='Interface language'}else location.reload()});</script><style id="bf-theme-final">
