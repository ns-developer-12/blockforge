<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050510">
    <meta name="color-scheme" content="dark">
    <title>راهنمای BlockForge | پشتیبانی هوشمند</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root{
            --bg:#050510;
            --surface:rgba(15,15,32,.72);
            --surface2:rgba(22,22,45,.88);
            --border:rgba(255,255,255,.07);

            --gold:#d4a54a;
            --purple:#8b5cf6;
            --purple2:#a855f7;
            --green:#2ecc71;
            --green2:#1dd1a1;
            --red:#e74c3c;
            --blue:#3498db;
            --orange:#e67e22;
            --cyan:#00bcd4;

            --text:#e8e8e8;
            --text2:#a0a0a0;
            --text3:#666;

            --radius:14px;
            --safe:env(safe-area-inset-bottom,16px);
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            -webkit-tap-highlight-color:transparent;
        }

        html{
            font-size:15px;
            overflow-x:hidden;
            width:100%;
            scroll-behavior:smooth;
        }

        body{
            font-family:'Vazirmatn',sans-serif;
            background:var(--bg);
            background-image:
                radial-gradient(
                    ellipse at 50% 5%,
                    rgba(139,92,246,.07) 0%,
                    transparent 60%
                );
            color:var(--text);
            min-height:100dvh;
            overflow-x:hidden;
            padding-bottom:calc(82px + var(--safe));
        }

        button,
        input{
            font-family:inherit;
        }

        button{
            -webkit-user-select:none;
            user-select:none;
        }

        /* ================= HEADER ================= */

        .header{
            position:sticky;
            top:0;
            z-index:100;
            background:rgba(5,5,16,.92);
            backdrop-filter:blur(30px);
            -webkit-backdrop-filter:blur(30px);
            border-bottom:1px solid var(--border);
            padding:14px 18px;
            text-align:center;
        }

        .header h1{
            font-size:1.1rem;
            font-weight:900;
            color:#fff;
        }

        .header h1 span{
            color:var(--gold);
        }

        .header p{
            font-size:.55rem;
            color:var(--text3);
            margin-top:3px;
        }

        /* ================= MAIN ================= */

        #mainPage{
            padding:14px 16px;
        }

        .section-title{
            font-size:.7rem;
            font-weight:800;
            color:#fff;
            margin-bottom:10px;
            display:flex;
            align-items:center;
            gap:6px;
        }

        .section-title i{
            color:var(--gold);
            font-size:.65rem;
        }

        /* ================= SEARCH ================= */

        .search-box{
            display:flex;
            align-items:center;
            gap:8px;
            background:var(--surface);
            border:1px solid var(--border);
            border-radius:13px;
            padding:9px 12px;
            margin-bottom:14px;
            backdrop-filter:blur(12px);
        }

        .search-box i{
            color:var(--gold);
            font-size:.75rem;
        }

        .search-box input{
            width:100%;
            border:0;
            outline:0;
            background:transparent;
            color:#fff;
            font-size:.58rem;
        }

        .search-box input::placeholder{
            color:#666;
        }

        /* ================= CATEGORIES ================= */

        .cats-grid{
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:8px;
        }

        .cat-card{
            background:var(--surface);
            border:1px solid var(--border);
            border-radius:var(--radius);
            padding:16px 12px;
            text-align:center;
            cursor:pointer;
            transition:
                transform .2s ease,
                border-color .25s ease,
                background .25s ease;
            backdrop-filter:blur(10px);
            position:relative;
            overflow:hidden;
        }

        .cat-card::before{
            content:'';
            position:absolute;
            top:0;
            left:0;
            right:0;
            height:3px;
        }

        .cat-card.account::before{background:var(--purple)}
        .cat-card.mod::before{background:var(--green)}
        .cat-card.skin::before{background:var(--blue)}
        .cat-card.token::before{background:var(--orange)}
        .cat-card.server::before{background:var(--cyan)}
        .cat-card.problem::before{background:var(--red)}
        .cat-card.premium::before{background:var(--gold)}

        .cat-card.ai::before{
            background:linear-gradient(
                90deg,
                var(--purple2),
                var(--green2),
                var(--cyan)
            );
        }

        .cat-card:active{
            transform:scale(.96);
        }

        .cat-emoji{
            width:44px;
            height:44px;
            border-radius:14px;
            margin:0 auto 8px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:1.5rem;
            background:rgba(255,255,255,.04);
        }

        .cat-card.account .cat-emoji{background:rgba(139,92,246,.1)}
        .cat-card.mod .cat-emoji{background:rgba(46,204,113,.1)}
        .cat-card.skin .cat-emoji{background:rgba(52,152,219,.1)}
        .cat-card.token .cat-emoji{background:rgba(230,126,34,.1)}
        .cat-card.server .cat-emoji{background:rgba(0,188,212,.1)}
        .cat-card.problem .cat-emoji{background:rgba(231,76,60,.1)}
        .cat-card.premium .cat-emoji{
            background:rgba(212,165,74,.1)
        }

        .cat-card.ai .cat-emoji{
            background:
                linear-gradient(
                    135deg,
                    rgba(139,92,246,.15),
                    rgba(46,204,113,.1)
                );
            animation:aiGlow 2.5s infinite;
        }

        @keyframes aiGlow{
            0%,100%{
                box-shadow:0 0 10px rgba(139,92,246,.15);
            }
            50%{
                box-shadow:0 0 25px rgba(46,204,113,.25);
            }
        }

        .cat-name{
            font-size:.6rem;
            font-weight:700;
            color:#fff;
        }

        .cat-count{
            font-size:.42rem;
            color:var(--text3);
            background:rgba(255,255,255,.04);
            padding:2px 8px;
            border-radius:8px;
            margin-top:4px;
            display:inline-block;
        }

        /* ================= FAQ ================= */

        .faq-page,
        .ai-chat-page{
            display:none;
            padding:0 16px 20px;
        }

        .faq-page.active,
        .ai-chat-page.active{
            display:block;
        }

        .back-btn{
            display:flex;
            align-items:center;
            gap:8px;
            background:none;
            border:0;
            color:var(--gold);
            font-size:.6rem;
            font-weight:700;
            cursor:pointer;
            padding:12px 0;
        }

        .faq-title{
            font-size:.85rem;
            font-weight:900;
            color:#fff;
            margin-bottom:14px;
        }

        .faq-item{
            background:var(--surface);
            border:1px solid var(--border);
            border-radius:var(--radius);
            margin-bottom:8px;
            overflow:hidden;
            transition:border-color .25s ease;
            backdrop-filter:blur(10px);
        }

        .faq-item.open{
            border-color:rgba(212,165,74,.18);
        }

        .faq-question{
            padding:13px 16px;
            cursor:pointer;
            display:flex;
            align-items:center;
            gap:10px;
            user-select:none;
        }

        .q-icon{
            width:30px;
            height:30px;
            border-radius:10px;
            flex-shrink:0;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:1rem;
            background:rgba(255,255,255,.03);
        }

        .q-text{
            flex:1;
            font-size:.58rem;
            font-weight:600;
            color:#fff;
        }

        .q-arrow{
            color:var(--text3);
            font-size:.55rem;
            transition:transform .3s;
        }

        .faq-item.open .q-arrow{
            transform:rotate(180deg);
        }

        .faq-answer{
            display:grid;
            grid-template-rows:0fr;
            transition:grid-template-rows .35s ease;
        }

        .faq-item.open .faq-answer{
            grid-template-rows:1fr;
        }

        .faq-answer-inner{
            overflow:hidden;
            padding:0 16px;
            font-size:.55rem;
            color:var(--text2);
            line-height:2;
        }

        .faq-item.open .faq-answer-inner{
            padding-bottom:14px;
            padding-top:10px;
            border-top:1px solid rgba(255,255,255,.04);
        }

        .highlight{
            color:var(--gold);
            font-weight:700;
        }

        .link{
            color:var(--cyan);
        }

        /* ================= AI CHAT ================= */

        .ai-status{
            display:flex;
            align-items:center;
            gap:6px;
            font-size:.45rem;
            color:#777;
            margin:-7px 0 10px;
        }

        .ai-status-dot{
            width:7px;
            height:7px;
            border-radius:50%;
            background:var(--green);
            box-shadow:0 0 8px rgba(46,204,113,.5);
        }

        .ai-messages{
            height:52dvh;
            min-height:280px;
            max-height:520px;
            overflow-y:auto;
            padding:12px;
            display:flex;
            flex-direction:column;
            gap:8px;
            background:rgba(0,0,0,.3);
            border-radius:var(--radius);
            border:1px solid var(--border);
            margin-bottom:10px;
            overscroll-behavior:contain;
            scrollbar-width:thin;
        }

        .ai-msg{
            max-width:88%;
            padding:10px 13px;
            border-radius:12px;
            font-size:.58rem;
            line-height:1.9;
            white-space:normal;
            overflow-wrap:anywhere;
            animation:msgIn .25s ease;
        }

        @keyframes msgIn{
            from{
                opacity:0;
                transform:translateY(7px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .ai-msg.bot{
            background:rgba(139,92,246,.08);
            border:1px solid rgba(139,92,246,.15);
            align-self:flex-start;
        }

        .ai-msg.user{
            background:linear-gradient(
                135deg,
                var(--purple),
                #6d28d9
            );
            align-self:flex-end;
        }

        .ai-input-row{
            display:flex;
            gap:8px;
        }

        .ai-input{
            flex:1;
            min-width:0;
            background:var(--surface);
            border:2px solid var(--border);
            border-radius:12px;
            padding:11px 14px;
            color:#fff;
            font-size:.6rem;
            outline:none;
            transition:border-color .25s;
        }

        .ai-input:focus{
            border-color:var(--purple);
        }

        .ai-send{
            width:42px;
            height:42px;
            border-radius:12px;
            border:0;
            background:linear-gradient(
                135deg,
                var(--purple),
                var(--green2)
            );
            color:#fff;
            cursor:pointer;
            font-size:.9rem;
            flex-shrink:0;
        }

        .ai-send:disabled{
            opacity:.5;
            cursor:not-allowed;
        }

        .ai-typing{
            display:flex;
            gap:4px;
            padding:10px 13px;
            background:rgba(139,92,246,.08);
            border-radius:12px;
            align-self:flex-start;
        }

        .ai-typing span{
            width:5px;
            height:5px;
            border-radius:50%;
            background:#888;
            animation:typing 1s infinite;
        }

        .ai-typing span:nth-child(2){
            animation-delay:.2s;
        }

        .ai-typing span:nth-child(3){
            animation-delay:.4s;
        }

        @keyframes typing{
            0%,100%{transform:translateY(0)}
            50%{transform:translateY(-3px)}
        }

        .ai-suggestions{
            display:flex;
            gap:6px;
            overflow-x:auto;
            padding:2px 0 8px;
            scrollbar-width:none;
        }

        .ai-suggestions::-webkit-scrollbar{
            display:none;
        }

        .ai-suggestion{
            flex:0 0 auto;
            background:rgba(139,92,246,.08);
            border:1px solid rgba(139,92,246,.16);
            color:#bbb;
            padding:6px 10px;
            border-radius:20px;
            font-size:.45rem;
            cursor:pointer;
        }

        /* ================= BOTTOM NAV ================= */

        .bottom-nav{
            position:fixed;
            bottom:0;
            left:0;
            right:0;
            background:rgba(8,8,18,.96);
            backdrop-filter:blur(30px);
            -webkit-backdrop-filter:blur(30px);
            border-top:1px solid var(--border);
            display:flex;
            padding:8px 0 calc(8px + var(--safe));
            z-index:50;
        }

        .bottom-nav a,
        .bottom-nav button{
            flex:1;
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:3px;
            color:var(--text3);
            text-decoration:none;
            font-size:.48rem;
            transition:.25s;
            padding:4px;
            background:none;
            border:0;
            cursor:pointer;
        }

        .bottom-nav a i,
        .bottom-nav button i{
            font-size:1rem;
        }

        .bottom-nav .active{
            color:var(--gold);
        }

        /* ================= EMPTY ================= */

        .empty-result{
            text-align:center;
            padding:35px 15px;
            color:#666;
            font-size:.55rem;
        }

        .empty-result i{
            font-size:2rem;
            margin-bottom:10px;
            color:#555;
        }

        @media(max-width:380px){
            .cats-grid{
                gap:6px;
            }

            .cat-card{
                padding:14px 8px;
            }

            .ai-msg{
                max-width:92%;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <h1>⚒️ Block<span>Forge</span></h1>
    <p>راهنمای سریع و دستیار هوشمند</p>
</header>

<!-- ================= MAIN ================= -->

<div id="mainPage">

    <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input
            id="faqSearch"
            type="search"
            autocomplete="off"
            placeholder="دنبال چی می‌گردی؟"
            oninput="searchFAQ(this.value)"
        >
    </div>

    <div class="section-title">
        <i class="fa-solid fa-tags"></i>
        یه بخش رو انتخاب کن:
    </div>

    <div class="cats-grid">

        <div class="cat-card account" onclick="openCategory('account')">
            <div class="cat-emoji">👤</div>
            <div class="cat-name">حساب کاربری</div>
            <span class="cat-count" id="count-account">0 سوال</span>
        </div>

        <div class="cat-card mod" onclick="openCategory('mod')">
            <div class="cat-emoji">🧩</div>
            <div class="cat-name">مودها</div>
            <span class="cat-count" id="count-mod">0 سوال</span>
        </div>

        <div class="cat-card skin" onclick="openCategory('skin')">
            <div class="cat-emoji">🎨</div>
            <div class="cat-name">اسکین و تکسچر</div>
            <span class="cat-count" id="count-skin">0 سوال</span>
        </div>

        <div class="cat-card token" onclick="openCategory('token')">
            <div class="cat-emoji">💰</div>
            <div class="cat-name">توکن و پرداخت</div>
            <span class="cat-count" id="count-token">0 سوال</span>
        </div>

        <div class="cat-card server" onclick="openCategory('server')">
            <div class="cat-emoji">🖥️</div>
            <div class="cat-name">سرورها</div>
            <span class="cat-count" id="count-server">0 سوال</span>
        </div>

        <div class="cat-card problem" onclick="openCategory('problem')">
            <div class="cat-emoji">🔧</div>
            <div class="cat-name">مشکلات رایج</div>
            <span class="cat-count" id="count-problem">0 سوال</span>
        </div>

        <div class="cat-card premium" onclick="openCategory('premium')">
            <div class="cat-emoji">👑</div>
            <div class="cat-name">پرمیوم</div>
            <span class="cat-count" id="count-premium">0 سوال</span>
        </div>

        <div class="cat-card ai" onclick="openAIChat()">
            <div class="cat-emoji">🤖</div>
            <div class="cat-name">هوش مصنوعی</div>
            <span class="cat-count">هوشمند</span>
        </div>

    </div>
</div>

<!-- ================= FAQ PAGE ================= -->

<div class="faq-page" id="faqPage">

    <button class="back-btn" onclick="closeCategory()">
        <i class="fa-solid fa-arrow-right"></i>
        برگشت
    </button>

    <div class="faq-title" id="faqTitle"></div>

    <div id="faqList"></div>

</div>

<!-- ================= AI PAGE ================= -->

<div class="ai-chat-page" id="aiChatPage">

    <button class="back-btn" onclick="closeAIChat()">
        <i class="fa-solid fa-arrow-right"></i>
        برگشت
    </button>

    <div class="faq-title">
        🤖 دستیار هوشمند BlockForge
    </div>

    <div class="ai-status">
        <span class="ai-status-dot"></span>
        سیستم دانش محلی فعال است
    </div>

    <div class="ai-suggestions">
        <button class="ai-suggestion" onclick="useSuggestion('چجوری ثبت نام کنم؟')">
            ثبت‌نام
        </button>

        <button class="ai-suggestion" onclick="useSuggestion('کد تایید ایمیلم نمیاد')">
            کد تأیید
        </button>

        <button class="ai-suggestion" onclick="useSuggestion('چطور مود دانلود کنم؟')">
            دانلود مود
        </button>

        <button class="ai-suggestion" onclick="useSuggestion('چجوری توکن رایگان بگیرم؟')">
            توکن
        </button>

        <button class="ai-suggestion" onclick="useSuggestion('رمزم رو فراموش کردم')">
            فراموشی رمز
        </button>
    </div>

    <div class="ai-messages" id="aiMessages"></div>

    <div class="ai-input-row">

        <input
            type="text"
            class="ai-input"
            id="aiInput"
            maxlength="500"
            autocomplete="off"
            placeholder="هر سوالی داری بپرس..."
        >

        <button
            class="ai-send"
            id="aiSend"
            onclick="sendAIMessage()"
            aria-label="ارسال"
        >
            <i class="fa-solid fa-paper-plane"></i>
        </button>

    </div>

</div>

<!-- ================= NAV ================= -->

<nav class="bottom-nav">

    <a href="index.html">
        <i class="fa-solid fa-house"></i>
        خانه
    </a>

    <a href="#" class="active" onclick="goMain();return false;">
        <i class="fa-solid fa-circle-question"></i>
        راهنما
    </a>

    <a href="#" onclick="openAIChat();return false;">
        <i class="fa-solid fa-robot"></i>
        هوش مصنوعی
    </a>

    <button onclick="logout()">
        <i class="fa-solid fa-right-from-bracket"></i>
        خروج
    </button>

</nav>

/* =========================================================
   TEXT NORMALIZATION
   ========================================================= */

function normalizeText(text){

    return String(text || '')
        .toLowerCase()

        // یکنواخت کردن حروف فارسی
        .replace(/ي/g,'ی')
        .replace(/ى/g,'ی')
        .replace(/ك/g,'ک')

        // نیم فاصله
        .replace(/\u200c/g,' ')

        // اعداد فارسی
        .replace(/[۰-۹]/g, d =>
            '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)
        )

        // حذف علائم اضافی
        .replace(/[؟?!.,،؛:()\[\]{}"'`~@#$%^&*_+=|\\/<>-]/g,' ')

        // چند فاصله → یک فاصله
        .replace(/\s+/g,' ')
        .trim();
}


/* =========================================================
   TOKENIZATION
   ========================================================= */

function tokenize(text){

    return normalizeText(text)
        .split(' ')
        .filter(word => word.length >= 2);
}


/* =========================================================
   SIMPLE LEVENSHTEIN
   برای تحمل غلط تایپی ساده
   ========================================================= */

function levenshtein(a,b){

    if(a === b) return 0;

    if(!a.length) return b.length;
    if(!b.length) return a.length;

    const matrix = [];

    for(let i=0;i<=b.length;i++){
        matrix[i] = [i];
    }

    for(let j=0;j<=a.length;j++){
        matrix[0][j] = j;
    }

    for(let i=1;i<=b.length;i++){

        for(let j=1;j<=a.length;j++){

            matrix[i][j] =
                b[i-1] === a[j-1]
                ? matrix[i-1][j-1]
                : Math.min(
                    matrix[i-1][j-1] + 1,
                    matrix[i][j-1] + 1,
                    matrix[i-1][j] + 1
                );
        }
    }

    return matrix[b.length][a.length];
}


/* =========================================================
   KEYWORD SCORE
   ========================================================= */

function keywordScore(question, keyword){

    const q = normalizeText(question);
    const k = normalizeText(keyword);

    if(!q || !k) return 0;

    let score = 0;

    // تطبیق کامل عبارت
    if(q.includes(k)){
        score += Math.min(60, k.length * 4);
    }

    const qWords = tokenize(q);
    const kWords = tokenize(k);

    // کلمات مشترک
    for(const kw of kWords){

        if(qWords.includes(kw)){
            score += 18 + Math.min(kw.length,8);
            continue;
        }

        // بخشی از کلمه
        for(const qw of qWords){

            if(qw.length < 3 || kw.length < 3) continue;

            if(qw.includes(kw) || kw.includes(qw)){
                score += 8;
                continue;
            }

            // غلط تایپی ساده
            const distance = levenshtein(qw,kw);

            if(
                distance <= 1 &&
                Math.min(qw.length,kw.length) >= 4
            ){
                score += 7;
            }
        }
    }

    return score;
}


/* =========================================================
   SMART AI SEARCH
   ========================================================= */

function findAIAnswers(question){

    const q = normalizeText(question);

    if(!q) return [];

    const results = [];

    for(const item of aiKnowledge){

        let score = 0;

        for(const keyword of item.k){
            score += keywordScore(q,keyword);
        }

        // سوال‌های بسیار کوتاه
        const words = tokenize(q);

        if(words.length <= 2){
            score *= .85;
        }

        if(score > 0){
            results.push({
                item,
                score
            });
        }
    }

    results.sort((a,b)=>b.score-a.score);

    return results;
}


/* =========================================================
   ANSWER GENERATOR
   ========================================================= */

function findAIAnswer(question){

    const results = findAIAnswers(question);

    if(!results.length){
        return null;
    }

    const best = results[0];

    // حداقل اطمینان
    if(best.score < 10){
        return null;
    }

    return best.item;
}

/* =========================================================
   SAFE MESSAGE RENDERING
   ========================================================= */

function formatBotText(text){

    const safe = document.createElement('div');

    safe.textContent = text;

    return safe.innerHTML
        .replace(/\n/g,'<br>')
        .replace(
            /(https?:\/\/[^\s<]+)/g,
            '<a href="$1" target="_blank" rel="noopener noreferrer" style="color:#00bcd4">$1</a>'
        );
}


/* =========================================================
   AI MESSAGE
   ========================================================= */

function addAIMsg(text,sender){

    const container =
        document.getElementById('aiMessages');

    const div =
        document.createElement('div');

    div.className =
        'ai-msg ' + sender;

    if(sender === 'bot'){
        div.innerHTML = formatBotText(text);
    }else{
        // بسیار مهم: پیام کاربر مستقیم innerHTML نمی‌شود
        div.textContent = text;
    }

    container.appendChild(div);

    requestAnimationFrame(()=>{
        container.scrollTop =
            container.scrollHeight;
    });
}


/* =========================================================
   AI HISTORY
   ========================================================= */

const AI_HISTORY_KEY = 'bf_help_ai_history';

function saveAIHistory(){

    try{

        const messages = [];

        document
            .querySelectorAll('#aiMessages .ai-msg')
            .forEach(el=>{

                messages.push({
                    sender:el.classList.contains('user')
                        ? 'user'
                        : 'bot',
                    text:el.textContent
                });

            });

        localStorage.setItem(
            AI_HISTORY_KEY,
            JSON.stringify(messages.slice(-30))
        );

    }catch(e){
        console.warn('AI history unavailable');
    }
}


function loadAIHistory(){

    try{

        const raw =
            localStorage.getItem(AI_HISTORY_KEY);

        if(!raw) return;

        const data =
            JSON.parse(raw);

        if(!Array.isArray(data)) return;

        data.slice(-30).forEach(msg=>{

            if(
                msg &&
                typeof msg.text === 'string' &&
                (msg.sender === 'user' || msg.sender === 'bot')
            ){
                addAIMsg(
                    msg.text,
                    msg.sender
                );
            }

        });

    }catch(e){

        localStorage.removeItem(AI_HISTORY_KEY);

    }
}


/* =========================================================
   AI CHAT
   ========================================================= */

let aiBusy = false;

function openAIChat(){

    document.getElementById('mainPage').style.display='none';

    document.getElementById('faqPage').classList.remove('active');
    document.getElementById('faqPage').style.display='none';

    document.getElementById('aiChatPage').classList.add('active');
    document.getElementById('aiChatPage').style.display='block';

    const messages =
        document.getElementById('aiMessages');

    if(messages.children.length === 0){

        loadAIHistory();

        if(messages.children.length === 0){

            addAIMsg(
                'سلام! 👋 من دستیار هوشمند BlockForge هستم.\n\nاطلاعات من از راهنمای داخلی BlockForge گرفته شده. سوالت رو بپرس تا بهترین پاسخ مرتبط رو پیدا کنم.',
                'bot'
            );

            saveAIHistory();
        }
    }

    updateNav('ai');

    setTimeout(()=>{
        document.getElementById('aiInput')?.focus();
    },200);
}


function closeAIChat(){
    goMain();
}


function useSuggestion(text){

    const input =
        document.getElementById('aiInput');

    input.value = text;

    sendAIMessage();
}


/* =========================================================
   SEND AI
   ========================================================= */

function sendAIMessage(){

    if(aiBusy) return;

    const input =
        document.getElementById('aiInput');

    const send =
        document.getElementById('aiSend');

    const text =
        input.value.trim();

    if(!text) return;

    if(text.length > 500){

        addAIMsg(
            '⚠️ پیام خیلی طولانیه. لطفاً سوالت رو کوتاه‌تر بنویس.',
            'bot'
        );

        return;
    }

    aiBusy=true;

    input.value='';

    addAIMsg(text,'user');

    const typing =
        document.createElement('div');

    typing.className='ai-typing';
    typing.id='aiTyping';

    typing.innerHTML=
        '<span></span><span></span><span></span>';

    document
        .getElementById('aiMessages')
        .appendChild(typing);

    send.disabled=true;

    const delay =
        450 + Math.random()*500;

    setTimeout(()=>{

        document.getElementById('aiTyping')?.remove();

        const answer =
            findAIAnswer(text);

        if(answer){

            addAIMsg(
                answer.a,
                'bot'
            );

        }else{

            addAIMsg(
                fallbackAnswer(),
                'bot'
            );

        }

        saveAIHistory();

        aiBusy=false;
        send.disabled=false;

        input.focus();

    },delay);
}

/* =========================================================
   NAV
   ========================================================= */

function updateNav(active){

    document
        .querySelectorAll('.bottom-nav a,.bottom-nav button')
        .forEach(el=>el.classList.remove('active'));

    const links =
        document.querySelectorAll('.bottom-nav a');

    if(active === 'main'){
        links[1]?.classList.add('active');
    }

    if(active === 'ai'){
        links[2]?.classList.add('active');
    }
}


function goMain(){

    document.getElementById('mainPage').style.display='block';

    document.getElementById('faqPage').classList.remove('active');
    document.getElementById('faqPage').style.display='none';

    document.getElementById('aiChatPage').classList.remove('active');
    document.getElementById('aiChatPage').style.display='none';

    updateNav('main');

    window.scrollTo({
        top:0,
        behavior:'smooth'
    });
}


function openCategory(cat){

    const data =
        faqDatabase[cat];

    if(!data) return;

    document.getElementById('mainPage').style.display='none';

    document.getElementById('faqPage').classList.add('active');
    document.getElementById('faqPage').style.display='block';

    document.getElementById('aiChatPage').classList.remove('active');
    document.getElementById('aiChatPage').style.display='none';

    document.getElementById('faqTitle').textContent =
        data.icon + ' ' + data.title;

    renderFAQ(data.faqs);

    updateNav('main');

    window.scrollTo({
        top:0,
        behavior:'smooth'
    });
}


function closeCategory(){
    goMain();
}


/* =========================================================
   FAQ RENDER
   ========================================================= */

function renderFAQ(list){

    const container =
        document.getElementById('faqList');

    if(!list.length){

        container.innerHTML=`
            <div class="empty-result">
                <i class="fa-solid fa-magnifying-glass"></i>
                <div>موردی پیدا نشد.</div>
            </div>
        `;

        return;
    }

    container.innerHTML='';

    list.forEach((f,i)=>{

        const item =
            document.createElement('div');

        item.className='faq-item';

        const question =
            document.createElement('div');

        question.className='faq-question';

        question.innerHTML=`
            <div class="q-icon"></div>
            <div class="q-text"></div>
            <i class="fa-solid fa-chevron-down q-arrow"></i>
        `;

        question.querySelector('.q-icon')
            .textContent=f.q[0] || '؟';

        question.querySelector('.q-text')
            .textContent=f.q;

        question.addEventListener(
            'click',
            ()=>toggleFAQ(item)
        );

        const answer =
            document.createElement('div');

        answer.className='faq-answer';

        const inner =
            document.createElement('div');

        inner.className='faq-answer-inner';

        // پاسخ‌های ثابت مدیر می‌توانند HTML محدود داشته باشند.
        // چون این داده‌ها از کد داخلی سایت هستند.
        inner.innerHTML=f.a;

        answer.appendChild(inner);

        item.appendChild(question);
        item.appendChild(answer);

        container.appendChild(item);
    });
}


function toggleFAQ(item){

    const wasOpen =
        item.classList.contains('open');

    document
        .querySelectorAll('.faq-item.open')
        .forEach(el=>el.classList.remove('open'));

    if(!wasOpen){
        item.classList.add('open');
    }
}


/* =========================================================
   FAQ SEARCH
   ========================================================= */

function searchFAQ(value){

    const q =
        normalizeText(value);

    if(!q){

        document
            .querySelectorAll('.cat-card')
            .forEach(el=>{
                el.style.display='';
            });

        return;
    }

    const scores = {};

    for(
        const [cat,data]
        of Object.entries(faqDatabase)
    ){

        let best=0;

        for(const faq of data.faqs){

            best=Math.max(
                best,
                keywordScore(q,faq.q)
            );

            best=Math.max(
                best,
                keywordScore(q,faq.a.replace(/<[^>]*>/g,' '))
            );
        }

        scores[cat]=best;
    }

    document
        .querySelectorAll('.cat-card')
        .forEach(card=>{

            const match =
                card.className
                    .split(' ')
                    .find(x=>scores[x] !== undefined);

            if(!match) return;

            card.style.display =
                scores[match] > 0
                ? ''
                : 'none';
        });
}
