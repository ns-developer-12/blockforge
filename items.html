<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070711">
<title>BlockForge | جزئیات آیتم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="mods.js"></script>
<style>
:root{--bg:#070711;--panel:#10101c;--panel2:#151522;--text:#f7f7fb;--muted:#9999aa;--purple:#8b5cf6;--green:#1dd1a1;--gold:#f0c040;--red:#ff647c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Vazirmatn,Arial,sans-serif;background:var(--bg);color:var(--text)}
body{padding-bottom:35px}.top{position:sticky;top:0;z-index:10;padding:13px 15px;background:rgba(7,7,17,.82);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:10px}
.icon-btn{width:42px;height:42px;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:rgba(255,255,255,.045);color:#fff;display:grid;place-items:center;font-size:1rem;cursor:pointer}.brand{font-weight:900;font-size:1rem}.brand span{color:var(--purple)}
.wrap{width:min(760px,calc(100% - 26px));margin:20px auto}.hero{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.08);border-radius:25px;background:linear-gradient(145deg,#161625,#0c0c16);box-shadow:0 20px 70px rgba(0,0,0,.35);animation:rise .55s ease both}
.hero::before{content:"";position:absolute;width:220px;height:220px;left:-90px;top:-100px;border-radius:50%;background:rgba(139,92,246,.16);filter:blur(20px)}.hero-img{width:100%;height:270px;object-fit:cover;display:block;background:#12121e}.hero-body{padding:18px}.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-size:.67rem;font-weight:800;background:rgba(139,92,246,.12);color:#cdbaff;border:1px solid rgba(139,92,246,.22)}
h1{font-size:1.55rem;margin:12px 0 5px;line-height:1.45}.author{color:var(--muted);font-size:.72rem}.rating{margin-top:10px;color:var(--gold);font-size:.72rem;font-weight:800}
.section{margin-top:13px;padding:16px;border:1px solid rgba(255,255,255,.07);border-radius:20px;background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.018));box-shadow:0 12px 35px rgba(0,0,0,.14);animation:rise .6s ease both}.section:nth-of-type(2){animation-delay:.06s}.section:nth-of-type(3){animation-delay:.12s}.section-title{display:flex;align-items:center;gap:8px;font-size:.8rem;font-weight:900;margin-bottom:12px}.section-title i{color:var(--purple)}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.info{padding:12px 8px;text-align:center;border-radius:15px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.05)}.info i{font-size:.9rem;color:var(--green);margin-bottom:6px}.info small{display:block;color:#77778a;font-size:.58rem}.info strong{display:block;margin-top:3px;font-size:.68rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.description{position:relative;line-height:2.05;font-size:.78rem;color:#d8d8e2;white-space:pre-wrap}.description::before{content:"";position:absolute;right:-16px;top:0;width:3px;height:100%;border-radius:99px;background:linear-gradient(var(--purple),var(--green));opacity:.7}
.price{display:flex;align-items:center;justify-content:space-between;gap:12px}.price-main{font-size:1.15rem;font-weight:900;color:var(--gold)}.old{text-decoration:line-through;color:#777;font-size:.7rem;margin-left:7px}.discount{font-size:.62rem;color:#77e8c5;background:rgba(29,209,161,.1);padding:5px 8px;border-radius:8px}.download{width:100%;border:0;border-radius:15px;padding:14px;background:linear-gradient(100deg,var(--purple),#6d4ce7);color:#fff;font-family:inherit;font-weight:900;font-size:.78rem;cursor:pointer;box-shadow:0 10px 30px rgba(139,92,246,.18);transition:.2s}.download:active{transform:scale(.98)}.download.free{background:linear-gradient(100deg,#1aa981,#1dd1a1)}
.related{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.rel{overflow:hidden;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);cursor:pointer}.rel img{width:100%;height:80px;object-fit:cover;display:block}.rel div{padding:8px;font-size:.62rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{text-align:center;padding:60px 20px;color:#888}.toast{position:fixed;left:13px;right:13px;bottom:15px;z-index:30;padding:13px 15px;border-radius:15px;background:#fff;color:#151525;box-shadow:0 15px 45px rgba(0,0,0,.3);font-size:.72rem;font-weight:800;transform:translateY(130%);transition:.35s}.toast.show{transform:none}.loading{min-height:100vh;display:grid;place-items:center;background:#fff;color:#171525}.loaderbox{text-align:center}.loaderbox .orb{width:90px;height:90px;border-radius:28px;margin:auto;background:radial-gradient(circle,rgba(139,92,246,.18),rgba(255,255,255,.95) 65%);box-shadow:0 15px 50px rgba(139,92,246,.12);animation:pulse 1.8s infinite}.loaderbox p{font-size:.75rem;font-weight:900;margin-top:14px}@keyframes pulse{50%{transform:scale(1.07)}}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:560px){.hero-img{height:225px}.info-grid{grid-template-columns:1fr 1fr}.info:last-child{grid-column:1/-1}.related{grid-template-columns:1fr 1fr}.rel:last-child{display:none}}
</style>
</head>
<body>
<div id="loading" class="loading"><div class="loaderbox"><div class="orb"></div><p>در حال آماده‌سازی آیتم...</p></div></div>
<div id="page" style="display:none">
<header class="top"><button class="icon-btn" onclick="history.length>1?history.back():location.href='index.html'" aria-label="بازگشت"><i class="fa-solid fa-arrow-right"></i></button><div class="brand">Block<span>Forge</span></div></header>
<main class="wrap" id="content"></main>
<div class="toast" id="toast"></div>
</div>
<script>
(function(){
'use strict';
const params=new URLSearchParams(location.search); const id=Number(params.get('id'));
function auth(){try{const a=JSON.parse(localStorage.getItem('bf_auth')||'{}');if(!a.loggedIn||Date.now()-a.time>30*24*60*60*1000){location.href='auth.html';return false}}catch(e){location.href='auth.html';return false}return true}
function tokens(){try{const d=JSON.parse(localStorage.getItem('bf_tokens')||'{"tokens":2000,"last":'+Date.now()+'}');const e=Date.now()-d.last;if(e>=21600000){d.tokens=Math.min(50000,d.tokens+Math.floor(e/21600000)*2000);d.last=Date.now()-(e%21600000);localStorage.setItem('bf_tokens',JSON.stringify(d))}return d.tokens}catch(e){return 0}}
function spend(n){const d=JSON.parse(localStorage.getItem('bf_tokens')||'{"tokens":2000,"last":'+Date.now()+'}');if(tokens()<n)return false;d.tokens=tokens()-n;localStorage.setItem('bf_tokens',JSON.stringify(d));return true}
function purchased(){try{const a=JSON.parse(localStorage.getItem('bf_purchases')||'{}');const u=JSON.parse(localStorage.getItem('bf_auth')||'{}');const k=u.email&&u.email!=='---'?u.email:(u.username||'guest');return new Set((a[k]||[]).map(Number))}catch(e){return new Set()}}
function mark(id){const a=JSON.parse(localStorage.getItem('bf_purchases')||'{}');const u=JSON.parse(localStorage.getItem('bf_auth')||'{}');const k=u.email&&u.email!=='---'?u.email:(u.username||'guest');const s=purchased();s.add(Number(id));a[k]=[...s];localStorage.setItem('bf_purchases',JSON.stringify(a))}
function num(v){if(typeof v==='number')return Number.isFinite(v)?v:0;const n=Number(String(v||0).replace(/,/g,'').replace(/[۰-۹]/g,c=>String('۰۱۲۳۴۵۶۷۸۹'.indexOf(c))));return Number.isFinite(n)?n:0}
function cost(i){const raw=num(i.price||i.cost||0), d=Math.max(0,Math.min(100,num(i.discount)));return Math.max(0,Math.round(raw-(raw*d/100)))}
function direct(url){try{const u=new URL(url,location.href);if(/drive\.google\.com|docs\.google\.com/.test(u.hostname)){let x=u.searchParams.get('id');if(!x){const m=u.pathname.match(/\/(?:file\/d|document\/d|spreadsheets\/d|presentation\/d)\/([^/]+)/);if(m)x=m[1]}if(x)return 'https://drive.google.com/uc?export=download&id='+encodeURIComponent(x)}}catch(e){}return url}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2600)}
function build(){if(typeof MY_CONTENT==='undefined')return [];return MY_CONTENT.map((i,n)=>({id:n+1,...i,img:i.img||'https://picsum.photos/seed/'+(n+1)+'/700/420'}))}
function render(){const all=build(), item=all.find(x=>x.id===id), root=document.getElementById('content');if(!item){root.innerHTML='<div class="empty"><i class="fa-solid fa-box-open" style="font-size:2rem"></i><h3>آیتم پیدا نشد</h3><p>شناسه‌ی این آیتم معتبر نیست.</p></div>';return}
const c=cost(item), p=purchased(), bought=p.has(item.id), disc=num(item.discount);const related=all.filter(x=>x.id!==item.id&&x.cat===item.cat).slice(0,3);
root.innerHTML=`<article class="hero"><img class="hero-img" src="${item.img}" alt="${item.title||''}" loading="eager"><div class="hero-body"><span class="badge"><i class="fa-solid fa-cube"></i> ${item.cat||'آیتم'}</span><h1>${item.title||'بدون عنوان'}</h1><div class="author">سازنده: ${item.author||'ناشناس'}</div>${item.rating?`<div class="rating"><i class="fa-solid fa-star"></i> ${item.rating}</div>`:''}</div></article>
<section class="section"><div class="section-title"><i class="fa-solid fa-circle-info"></i> اطلاعات آیتم</div><div class="info-grid"><div class="info"><i class="fa-solid fa-user"></i><small>سازنده</small><strong>${item.author||'ناشناس'}</strong></div><div class="info"><i class="fa-solid fa-code-branch"></i><small>ورژن</small><strong>${item.version||'---'}</strong></div><div class="info"><i class="fa-solid fa-weight-hanging"></i><small>حجم</small><strong>${item.size||'---'}</strong></div></div></section>
<section class="section"><div class="section-title"><i class="fa-solid fa-align-right"></i> توضیحات کامل</div><div class="description">${item.desc||'برای این آیتم توضیحی ثبت نشده است.'}</div></section>
<section class="section"><div class="section-title"><i class="fa-solid fa-download"></i> دریافت فایل</div>${c>0&&!bought?`<div class="price"><div class="price-main">${disc?`<span class="old">${num(item.price).toLocaleString('fa')}</span>`:''}<i class="fa-solid fa-coins"></i> ${c.toLocaleString('fa')} توکن</div>${disc?`<span class="discount">-${disc}%</span>`:''}</div><div style="height:12px"></div>`:''}<button id="download" class="download ${c===0||bought?'free':''}">${bought?'دانلود':' '+(c===0?'دانلود رایگان':'خرید و دانلود')+' '}</button></section>
${related.length?`<section class="section"><div class="section-title"><i class="fa-solid fa-link"></i> آیتم‌های مرتبط</div><div class="related">${related.map(r=>`<div class="rel" onclick="location.href='items.html?id=${r.id}'"><img src="${r.img}" alt=""><div>${r.title||''}</div></div>`).join('')}</div></section>`:''}`;
document.getElementById('download').onclick=()=>download(item,c,bought)}
function download(item,c,bought){if(!item.downloadUrl){toast('لینک دانلود برای این آیتم ثبت نشده است.');return}if(bought||c===0){mark(item.id);location.href=direct(item.downloadUrl);return}if(tokens()<c){toast('توکن کافی نیست. موجودی: '+tokens().toLocaleString('fa')+' توکن');return}if(!spend(c)){toast('پرداخت انجام نشد.');return}mark(item.id);toast('خرید با موفقیت انجام شد؛ دریافت فایل شروع می‌شود.');setTimeout(()=>location.href=direct(item.downloadUrl),700)}
if(auth()){render();document.getElementById('loading').style.display='none';document.getElementById('page').style.display='block'}
})();
</script>
</body></html>
