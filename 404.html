" points="37,0 0,120 75,120"/><polyline class="face__pupil" points="55,120 55,155" stroke-dasharray="35 35"/></g></g><rect class="face__nose" x="132.5" y="112.5" width="55" height="155" rx="4"/><g transform="translate(65,334)" stroke-dasharray="102 102"><path class="face__mouth-left" d="M0 30C0 30 40 0 95 0"/><path class="face__mouth-right" d="M95 0C150 0 190 30 190 30"/></g></svg><h1>۴۰۴</h1><h2>این مود پیدا نشد!</h2><p>لینک واردشده معتبر نیست یا محتوای موردنظر وجود ندارد.</p><a class="home-link" href="index.html">بازگشت به BlockForge</a></main><script src="theme.js"></script><style id="bf-theme-final">
