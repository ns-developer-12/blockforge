<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پرمیوم | BlockForge</title><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><style>
*{box-sizing:border-box}body{min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse at 50% 15%,rgba(255,255,255,.09),transparent 48%),var(--bf-bg)!important}
.premium-wrap{width:min(100% - 36px,620px);min-height:100vh;margin:auto;display:flex;flex-direction:column;justify-content:center;position:relative;padding:34px 0}
.premium-back{align-self:flex-start;text-decoration:none;color:var(--bf-muted);font-size:14px;font-weight:700;padding:10px 15px;border:1px solid var(--bf-border);border-radius:14px;background:color-mix(in srgb,var(--bf-panel) 72%,transparent);transition:.2s}
.premium-card{margin-top:26px;position:relative;overflow:hidden;text-align:center;padding:clamp(28px,7vw,54px) 24px;border-radius:30px;background:linear-gradient(145deg,rgba(255,255,255,.105),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.16);box-shadow:0 28px 90px rgba(0,0,0,.24),inset 0 1px rgba(255,255,255,.16);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.premium-card:before{content:"";position:absolute;width:260px;height:260px;top:-150px;right:calc(50% - 130px);border-radius:50%;background:rgba(255,255,255,.12);filter:blur(45px);pointer-events:none}
.premium-brand{font-size:14px;letter-spacing:4px;font-weight:950;color:var(--bf-text);direction:ltr}.premium-brand span{opacity:.55}
.premium-icon{width:94px;height:94px;margin:32px auto 22px;display:grid;place-items:center;border-radius:28px;font-size:38px;color:var(--bf-text);background:linear-gradient(145deg,rgba(255,255,255,.19),rgba(255,255,255,.045));border:1px solid rgba(255,255,255,.2);box-shadow:0 15px 45px rgba(0,0,0,.2),inset 0 1px rgba(255,255,255,.2)}
.premium-card h1{font-size:clamp(25px,5vw,34px);font-weight:950;margin:0 0 10px;color:var(--bf-text)}.premium-desc{margin:0 auto;max-width:390px;line-height:2;color:var(--bf-muted);font-size:14px}
.soon-pill{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:10px;margin-top:28px;padding:11px 22px;border-radius:99px;background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.22);color:var(--bf-text);font-size:11px;font-weight:900;letter-spacing:2.4px;direction:ltr;box-shadow:0 12px 32px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.24);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%)}.soon-pill:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);background-size:250% 100%;animation:soonSweep 2.8s ease-in-out infinite}@keyframes soonSweep{from{background-position:140% 0}to{background-position:-140% 0}}.soon-dot{width:8px;height:8px;position:relative;z-index:1;border-radius:50%;background:currentColor;box-shadow:0 0 13px currentColor;animation:pulse 1.7s infinite}@keyframes pulse{50%{opacity:.35;transform:scale(.75)}}
.premium-foot{margin-top:22px;text-align:center;color:var(--bf-muted);font-size:11px;letter-spacing:1px;direction:ltr}
html[data-theme="light"] .premium-card{background:linear-gradient(145deg,rgba(255,255,255,.82),rgba(245,245,245,.62));border-color:rgba(0,0,0,.12);box-shadow:0 25px 70px rgba(0,0,0,.09),inset 0 1px #fff}html[data-theme="light"] .premium-icon{background:linear-gradient(145deg,#fff,#eee);border-color:rgba(0,0,0,.1);box-shadow:0 14px 35px rgba(0,0,0,.09)}html[data-theme="light"] .soon-pill{background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(240,240,240,.72));border-color:rgba(0,0,0,.12);box-shadow:0 10px 26px rgba(0,0,0,.08),inset 0 1px #fff}html[data-theme="light"] .soon-pill:before{background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.95) 50%,transparent 70%)}
</style></head><body><main class="premium-wrap"><a class="premium-back" href="index.html"><i class="fa-solid fa-arrow-right"></i> بازگشت به خانه</a><section class="premium-card"><div class="premium-brand">BLOCK<span>FORGE</span></div><div class="premium-icon"><i class="fa-solid fa-crown"></i></div><h1>تجربه‌ای فراتر در راه است</h1><p class="premium-desc">بخش پرمیوم BlockForge در حال آماده‌سازی است. به‌زودی امکانات ویژه، تجربه‌ای روان‌تر و قابلیت‌های اختصاصی در دسترس قرار می‌گیرند.</p><div class="soon-pill"><span class="soon-dot"></span> COMING SOON</div></section><div class="premium-foot">BLOCKFORGE · PREMIUM EXPERIENCE</div></main><script src="theme.js"></script></body></html>
